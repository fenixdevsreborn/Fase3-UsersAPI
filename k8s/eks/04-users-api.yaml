apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fase4
  labels:
    app: users-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - users-api
              topologyKey: kubernetes.io/hostname
      containers:
      - name: users-api
        image: adinteltidev/fase4-users-api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: db-connection
        - name: Jwt__Secret
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-secret
        - name: Jwt__Issuer
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-issuer
        - name: Jwt__Audience
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-audience
        - name: Jwt__KeyId
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: jwt-key-id
        - name: Jwt__ExpirationHours
          value: "24"
        - name: RabbitMq__Host
          value: rabbitmq
        - name: RabbitMq__Port
          value: "5672"
        - name: RabbitMq__Username
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-user
        - name: RabbitMq__Password
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-pass
        - name: RabbitMq__VirtualHost
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secrets
              key: rabbitmq-vhost
        - name: RabbitMq__ExchangeName
          value: fiap.events
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
