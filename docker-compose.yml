# PostgreSQL 17 sobe primeiro (com persistência); a API sobe depois e conecta em Host=postgres.
# Build: docker compose build
# Run:   docker compose up -d

services:
  postgres:
    image: postgres:17-bookworm
    container_name: fcg-users-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fcg_users
    ports:
      - "5432:5432"
    volumes:
      - users_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fcg_users"]
      interval: 5s
      timeout: 5s
      retries: 5

  fcg.users.api:
    image: ${DOCKER_REGISTRY-}fcgusersapi
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__UsersDb: "Host=postgres;Database=fcg_users;Username=postgres;Password=postgres;Include Error Detail=true"
    ports:
      - "8080:8080"

volumes:
  users_pgdata:
