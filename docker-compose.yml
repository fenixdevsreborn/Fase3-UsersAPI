name: fase4-usersapi

services:
  postgres:
    image: postgres:16-alpine
    container_name: ms-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: users_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fiap-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_DEFAULT_VHOST: fiap
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ms-network

  users-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-users-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users_db;Username=postgres;Password=postgres123;"
      Jwt__Secret: "your-super-secret-key-at-least-32-characters-long!"
      Jwt__Issuer: "ms-users-api"
      Jwt__Audience: "ms-users-api-client"
      Jwt__ExpirationHours: "24"
      RabbitMq__Host: rabbitmq
      RabbitMq__Port: "5672"
      RabbitMq__Username: admin
      RabbitMq__Password: admin123
      RabbitMq__VirtualHost: fiap
      RabbitMq__ExchangeName: fiap.events
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ms-network

volumes:
  postgres_data:
    name: fiap-postgres-data
  rabbitmq_data:
    name: fiap-rabbitmq-data

networks:
  ms-network:
    name: fiap-ms-network
    driver: bridge
